@if (isAuthenticated) {
<div class="h-full w-full bg-neutral-900 flex flex-col overflow-hidden">
  <!-- Compact Filter Bar (when side filter is collapsed) -->
  @if (!filterSideLayout) {
    <app-jobs-filters
      [sideFilterActive]="false"
      [totalSearchResults]="resultsData.totalElements"
      (searchEvent)="search($event)"
      class="flex-shrink-0 w-full"
    />
   }

  <!-- Main Content Area -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Side Filter Panel (when expanded) -->
    @if (filterSideLayout) {
      <app-jobs-filters
        [sideFilterActive]="true"
        [totalSearchResults]="resultsData.totalElements"
        (searchEvent)="search($event)"
        class="w-130 flex-shrink-0 border-r border-neutral-700/50 h-full overflow-y-auto"
      />
    }

    <!-- Job Results -->
    <app-job-results
      class="flex-1 overflow-hidden bg-neutral-900"
      [resultsData]="resultsData"
      [selectedJobRef]="selectedJobRef"
      [sideFilterActive]="filterSideLayout"
      (isjobDetailsOpen)="onJobDetailsOpen($event)"
      (onPageChangeEvent)="onPageChangeEvent($event)"
      (onJobSelected)="onJobSelected($event)"
    />
  </div>
</div>
} @else {
<!-- Unauthenticated View -->
<div class="h-full w-full bg-neutral-900 flex flex-col items-center justify-center">
  <div class="max-w-md mx-auto px-6 text-center">
    <i class="pi pi-briefcase text-5xl text-neutral-500 mb-6"></i>
    <h1 class="text-2xl font-semibold text-white mb-3">Find Your Dream Internship</h1>
    <p class="text-neutral-400 mb-8">
      Sign in to browse thousands of internship opportunities, save your favorites, and track your applications.
    </p>
    <button 
      pButton 
      (click)="login()"
      class="px-8 py-3 bg-emerald-600 hover:bg-emerald-500 border-0 rounded-lg text-base font-medium"
    >
      <i class="pi pi-sign-in mr-2"></i>
      Sign in to continue
    </button>
  </div>
</div>
}
