@if (isAuthenticated) {
<p-toast></p-toast>
<div class="h-full w-full bg-neutral-900 flex flex-col overflow-hidden">
  <!-- Simple Header -->
  <div class="flex-shrink-0 px-6 py-6 border-b border-neutral-800">
    <div class="max-w-3xl mx-auto">
      <h1 class="text-xl font-medium text-white">{{ 'resume.title' | transloco }}</h1>
    </div>
  </div>

  <!-- Content -->
  <div class="flex-1 overflow-y-auto px-6 py-8">
    <div class="max-w-3xl mx-auto space-y-6">
      
      <!-- Textarea -->
      <div>
        <label class="block text-sm text-neutral-400 mb-2">{{ 'resume.pasteJobDescription' | transloco }}</label>
        <textarea
          pTextarea
          [(ngModel)]="offerDescription"
          rows="14"
          [placeholder]="'resume.placeholder' | transloco"
          class="w-full p-4 bg-neutral-800 border border-neutral-700 rounded-lg text-neutral-200 placeholder:text-neutral-500 focus:border-emerald-500 focus:outline-none resize-none"
        ></textarea>
        <div class="flex justify-between mt-2 text-xs text-neutral-500">
          <span>{{ 'resume.minCharacters' | transloco }}</span>
          <span>{{ offerDescription.length }} {{ 'resume.chars' | transloco }}</span>
        </div>
      </div>

      <!-- Review toggle -->
      <div class="flex items-start gap-3 p-4 bg-neutral-800/50 border border-neutral-700 rounded-lg">
        <p-toggleswitch [(ngModel)]="enableReview" inputId="enableReview"></p-toggleswitch>
        <label for="enableReview" class="flex-1 cursor-pointer">
          <span class="block text-sm text-neutral-200">{{ 'resume.reviewLabel' | transloco }}</span>
          <span class="block text-xs text-neutral-500 mt-0.5">{{ 'resume.reviewHint' | transloco }}</span>
        </label>
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-between pt-2">
        <button
          pButton
          [text]="true"
          size="small"
          [disabled]="offerDescription.length === 0"
          (click)="offerDescription = ''"
          class="text-neutral-500 hover:text-neutral-300 disabled:opacity-30"
        >
          {{ 'resume.clear' | transloco }}
        </button>

        <button
          pButton
          [loading]="isGeneratingResume"
          [disabled]="offerDescription.length < 50"
          (click)="generateResume()"
          class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 border-0 rounded-lg text-sm font-medium transition-colors disabled:opacity-40 disabled:hover:bg-emerald-600"
        >
          @if (isGeneratingResume) {
            {{ 'resume.generating' | transloco }}
          } @else {
            {{ 'resume.generate' | transloco }}
          }
        </button>
      </div>

      <!-- Minimal hint -->
      <p class="text-xs text-neutral-600 pt-4">
        {{ 'resume.hint' | transloco }}
      </p>
    </div>
  </div>
</div>
} @else {
<!-- Unauthenticated View -->
<div class="h-full w-full bg-neutral-900 flex flex-col items-center justify-center">
  <div class="max-w-md mx-auto px-6 text-center">
    <i class="pi pi-file-edit text-5xl text-neutral-500 mb-6"></i>
    <h1 class="text-2xl font-semibold text-white mb-3">{{ 'resume.title' | transloco }}</h1>
    <p class="text-neutral-400 mb-8">
      {{ 'resume.signInSubtitle' | transloco }}
    </p>
    <button 
      pButton 
      (click)="login()"
      class="px-8 py-3 bg-emerald-600 hover:bg-emerald-500 border-0 rounded-lg text-base font-medium"
    >
      <i class="pi pi-sign-in mr-2"></i>
      {{ 'resume.signInButton' | transloco }}
    </button>
  </div>
</div>
}
